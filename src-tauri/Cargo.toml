[package]
name = "disk-lens"
version = "0.1.0"
description = "Analizator zajętości dysku: treemapa + drzewo folderów"
authors = ["Bartłomiej Zimny"]
edition = "2021"

[lib]
name = "disk_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
parking_lot = "0.12"
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
csv = "1"
trash = "5"
tauri-plugin-clipboard-manager = "2"
# Most do automatyzacji UI – tylko z funkcją `mcp-bridge` (pnpm build:debug).
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
