[package]
name = "disk-lens"
version = "0.3.0"
description = "Analizator zajętości dysku: treemapa + drzewo folderów"
authors = ["Bartłomiej Zimny"]
edition = "2021"

[lib]
name = "disk_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
parking_lot = "0.12"
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
csv = "1"
trash = "5"
tauri-plugin-clipboard-manager = "2"
# Most do automatyzacji UI – tylko z funkcją `mcp-bridge` (pnpm build:debug).
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }

# Aktualizacje z GitHub Releases (latest.json podpisany kluczem minisign, patrz tauri.conf.json).
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Miejsce „dostępne dla ważnych danych” i nazwa wolumenu z Findera (NSURL).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }

[target.'cfg(windows)'.dependencies]
# TLS systemowy (schannel) zamiast rustls – `ring` z rustls nie kompiluje się krzyżowo
# na aarch64-pc-windows-msvc przez cargo-xwin, a schannel korzysta z magazynu certyfikatów systemu.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
# Pomiar czasu read_dir / lstat / blokady drzewa (`cargo run --release --example scan --features scan-stats`).
scan-stats = []

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
